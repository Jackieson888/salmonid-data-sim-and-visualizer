<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salmon Run — A Boids Simulation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <canvas id="river-canvas"></canvas>

    <div id="hud">
      <div id="title-block">
        <h1>Snake River Salmon Run</h1>
        <p id="date-label">Loading run data…</p>
      </div>

      <div id="bottom-block">
        <div id="species-breakdown">
          <span class="species-chip" data-species="chinook">
            <i></i>Chinook <b id="count-chinook">0</b>
          </span>
          <span class="species-chip" data-species="jackChinook">
            <i></i>Jack Chinook <b id="count-jackChinook">0</b>
          </span>
          <span class="species-chip" data-species="steelhead">
            <i></i>Steelhead <b id="count-steelhead">0</b>
          </span>
          <span class="species-chip" data-species="shad">
            <i></i>Shad <b id="count-shad">0</b>
          </span>
        </div>

        <div id="controls">
          <button id="play-pause" aria-label="Play or pause">Pause</button>
          <input type="range" id="timeline" min="0" max="100" value="0" />
          <span id="fish-count">0 fish</span>
        </div>
      </div>
    </div>

    <pre id="debug-panel" hidden></pre>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
