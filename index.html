<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salmon Run — A Boids Simulation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <canvas id="river-canvas"></canvas>

    <!-- The HUD is deliberately styled as a fish-passage report rather than a
         consumer overlay: the numbers in it are real daily counts off the
         Columbia Basin Research DART feed for a Corps of Engineers project
         (see data.js), and reading them in the register they are actually
         published in is truer to the data than friendly rounded chips were.
         Hence the uppercase Helvetica labels, hairline rules, tabular
         numerals, and hard corners throughout — see style.css. -->
    <div id="hud">
      <header id="masthead">
        <p class="station">Project LWG &middot; Lower Granite Lock &amp; Dam</p>
        <h1>Adult Fish Passage</h1>
        <p class="reach">Snake River &middot; Counting Season 2015</p>
        <div class="rule"></div>
        <p class="readout">
          <span id="date-label">Loading run data…</span>
          <span id="day-ordinal"></span>
        </p>
      </header>

      <section id="report">
        <div class="report-head">
          <h2>Daily Adult Passage</h2>
          <p class="total"><span class="label">Total</span> <b id="fish-count">0</b></p>
        </div>

        <!-- Real per-day DART counts, not the simulated boid count (which is
             capped well below them — see MAX_POPULATION in main.js). Key
             colors match each species' InstancedMesh tint in
             scene/fishMesh.js's SPECIES_COLORS. -->
        <table id="species-breakdown">
          <tbody>
            <tr data-species="chinook">
              <td class="key"><i></i>Chinook</td>
              <td class="count" id="count-chinook">0</td>
              <td class="key"><i></i>Steelhead</td>
              <td class="count" id="count-steelhead">0</td>
            </tr>
            <tr data-species="jackChinook">
              <td class="key"><i></i>Jack Chinook</td>
              <td class="count" id="count-jackChinook">0</td>
              <td class="key"><i></i>Shad</td>
              <td class="count" id="count-shad">0</td>
            </tr>
          </tbody>
        </table>

        <div id="controls">
          <button id="play-pause" aria-label="Play or pause">Pause</button>
          <div id="timeline-block">
            <input
              type="range"
              id="timeline"
              min="0"
              max="100"
              value="0"
              aria-label="Date in the counting season"
            />
            <!-- Month ticks, positioned from runData at boot (see
                 buildTimelineAxis in main.js) rather than spaced evenly: the
                 record only covers the dam's counting season, so the months
                 are not equal fractions of the track. -->
            <div id="timeline-axis" aria-hidden="true"></div>
          </div>
        </div>

        <p class="source">
          Source &middot; Columbia Basin Research DART, adult daily counts
        </p>
      </section>
    </div>

    <pre id="debug-panel" hidden></pre>

    <div id="fish-loading">
      <div class="bar"></div>
      <p>Loading fish assets</p>
    </div>
  </main>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
